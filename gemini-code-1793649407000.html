<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync & Scale Co. | Operations, Strategy & Full-Service Execution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FAF9F6;
            --bg-card: #FFFFFF;
            --bg-accent: #F4F1EA;
            --text-primary: #1C1B1A;
            --text-muted: #66635F;
            --border-color: #E5E0D8;
            --accent-gold: #9E8256;
            --font-heading: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .text-center { text-align: center; }

        /* Top Bar & Header */
        .top-bar {
            background: var(--text-primary);
            color: var(--bg-main);
            text-align: center;
            padding: 8px 16px;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .navbar {
            background: rgba(250, 249, 246, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 16px 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-logo-img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            display: block;
        }

        .brand-subtitle {
            font-size: 0.68rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        /* Buttons */
        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-main);
            padding: 14px 28px;
            text-decoration: none;
            display: inline-block;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: 1px solid var(--text-primary);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #FFFFFF;
        }

        .btn-secondary {
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            text-decoration: none;
            display: inline-block;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-secondary:hover {
            border-color: var(--text-primary);
        }

        /* Hero Section */
        .hero-section {
            padding: 80px 0;
        }

        .grid-hero {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-accent);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 24px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-gold);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.6rem;
            line-height: 1.08;
            font-weight: 400;
            margin-bottom: 20px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent-gold);
        }

        .hero-desc {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 540px;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
            margin-bottom: 48px;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }

        .stat-num {
            display: block;
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 500;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hero-media {
            position: relative;
        }

        .image-frame {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border-radius: 4px;
        }

        .image-frame img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        .image-caption {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* About Section */
        .about-section {
            padding: 100px 0;
            background: #FFFFFF;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .grid-about {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 60px;
            align-items: center;
        }

        .social-tag {
            margin-top: 12px;
            text-align: right;
        }

        .social-tag a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .social-tag a:hover {
            color: var(--accent-gold);
        }

        .section-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            line-height: 1.15;
            margin-bottom: 24
